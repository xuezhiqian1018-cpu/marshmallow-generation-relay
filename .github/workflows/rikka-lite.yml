name: Build RikkaLite APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-ui deps
        working-directory: web-ui
        run: pnpm install --no-frozen-lockfile

      - name: Prepare fake google-services.json
        run: |
          cat > app/google-services.json << "JSONEOF"
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikka-lite",
              "storage_bucket": "rikka-lite.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "me.rerere.rikkahub" }
              },
              "api_key": [{ "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }],
              "services": { "analytics_service": { "status": 1 }, "appinvite_service": { "status": 1 } }
            }],
            "configuration_version": "1"
          }
          JSONEOF

      - name: Prepare signing
        run: |
          echo "FgIHgQAAAQgAAQAB" > /dev/null
          base64 -d << "KSEOF" > app/app.key
          
          KSEOF
          cat > local.properties << "LPEOF"
          storeFile=app/app.key
          storePassword=gongjuxing2026
          keyAlias=gongjuxing
          keyPassword=gongjuxing2026
          LPEOF

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaLite-apk
          path: app/build/outputs/apk/github/release/*-arm64-v8a-release.apk
          if-no-files-found: error
